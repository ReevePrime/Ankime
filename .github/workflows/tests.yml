name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where most users are; paths differ. Ubuntu 24.04, not -latest:
        # setup-python has no Python 3.9 for Ubuntu 26.04.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.13"]   # Anki 2.1.50 bundles 3.9; current Anki a recent 3.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest requests ruff
      - run: ruff check .
      - run: python -m pytest -q tests
      - run: python tools/build.py

  # The tests above stub Anki out; this starts the real one (from PyPI, no window shown) with
  # the add-on installed, see tools/anki_smoke.py. Windows only: it needs no system packages
  # for Qt there.
  anki:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Anki the manifest allows (min_point_version), with the Qt it shipped
          - name: "2.1.50"
            python: "3.9"
            packages: >-
              "aqt[qt6]==2.1.50" pyqt6==6.2.3 pyqt6-qt6==6.2.4 pyqt6-webengine==6.2.1
              pyqt6-webengine-qt6==6.2.4 "pyqt6-sip<13.5"
          - name: "25.09"
            python: "3.13"
            packages: '"aqt[qt6]==25.9.5"'
          # whatever is newest: a new Anki release can turn this red without a commit here
          - name: latest
            python: "3.13"
            packages: '"aqt[qt6]"'
    name: anki (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.packages }}
        shell: bash  # PowerShell, the default here, reads the < of a version pin as a redirection
      - run: python tools/anki_smoke.py

  # Every push to main that passes the jobs above publishes the build: the "dev" pre-release is
  # replaced each time (stable link: releases/download/dev/ankime.ankiaddon), and a version in
  # manifest.json with no release yet gets its own v<version> release, marked latest.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, anki]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/build.py
      - name: Publish dev build
        run: |
          cp dist/ankime-*.ankiaddon dist/ankime.ankiaddon
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/ankime.ankiaddon --prerelease --target "$GITHUB_SHA" \
            --title "Development build" \
            --notes "Built from $GITHUB_SHA, the latest commit on main. Install via Tools → Add-ons → Install from file…"
      - name: Publish version release
        run: |
          version=$(python -c "import json; print(json.load(open('manifest.json'))['human_version'])")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; bump human_version in manifest.json for a new one"
          else
            gh release create "v$version" "dist/ankime-$version.ankiaddon" --target "$GITHUB_SHA" \
              --title "Ankime $version" --generate-notes --latest
          fi
